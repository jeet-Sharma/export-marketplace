# Local development stack.
#
# Services:
#   app         — NestJS API (built from Dockerfile)
#   postgres    — primary relational database (TypeORM connects here)
#   localstack  — emulated AWS S3 + SQS (no real AWS credentials needed)
#
# Usage:
#   docker compose up --build        — build and start everything
#   docker compose up --build app    — rebuild only the app image
#   docker compose down              — stop all services (volumes kept)
#   docker compose logs -f app       — tail API logs
#
# Image pin (LocalStack): 4.4.0 is the last tag that boots without a
# LOCALSTACK_AUTH_TOKEN. Bump only after adding the token env var below.
# See https://blog.localstack.cloud/localstack-single-image-next-steps/

services:
  # ---------------------------------------------------------------------------
  # NestJS API
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: export-marketplace-api
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      # Postgres — use service name as host, not localhost
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-export_marketplace}
      TYPEORM_LOGGING: ${TYPEORM_LOGGING:-false}
      # AWS / LocalStack — use service name as host
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-export-marketplace-documents}
      AWS_SQS_QUEUE_NAME: ${AWS_SQS_QUEUE_NAME:-export-marketplace-events}
      # Auth / JWT — secrets have NO default on purpose (never hardcode a
      # secret). Supply them via the host .env; if unset, login returns a
      # clean 503 by design (see auth.config.ts / AuthService).
      AUTH_ACCESS_SECRET: ${AUTH_ACCESS_SECRET:-}
      AUTH_REFRESH_SECRET: ${AUTH_REFRESH_SECRET:-}
      AUTH_ACCESS_TTL_SECONDS: ${AUTH_ACCESS_TTL_SECONDS:-900}
      AUTH_REFRESH_TTL_SECONDS: ${AUTH_REFRESH_TTL_SECONDS:-2592000}
      AUTH_MAX_FAILED_LOGINS: ${AUTH_MAX_FAILED_LOGINS:-5}
      AUTH_LOCKOUT_MINUTES: ${AUTH_LOCKOUT_MINUTES:-15}
      # Mail (Gmail SMTP) — no defaults; if unset, email delivery is
      # unconfigured and the app degrades gracefully (verification emails
      # are logged/skipped rather than crashing). See mail.config.ts.
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Used to build verification links in emails.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Observe telemetry — off unless both are supplied (see app.module.ts).
      OBSERVE_APP_KEY: ${OBSERVE_APP_KEY:-}
      OBSERVE_APP_SECRET: ${OBSERVE_APP_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Migrations — one-shot job that brings a fresh database up to schema
  # before the API starts. Runs the compiled migrations via the plain
  # `typeorm` CLI (no ts-node in the production image). Without this, a fresh
  # Compose database has no tables and every auth query fails.
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: export-marketplace-migrate
    command: ['npm', 'run', 'migration:run:prod']
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-export_marketplace}
      TYPEORM_LOGGING: ${TYPEORM_LOGGING:-false}
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # PostgreSQL — primary database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: export-marketplace-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_HOST_PORT:-55432}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-export_marketplace}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-export_marketplace}']
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # LocalStack — emulated AWS S3 + SQS
  # ---------------------------------------------------------------------------
  localstack:
    image: localstack/localstack:4.4.0
    container_name: export-marketplace-localstack
    restart: unless-stopped
    ports:
      - '4566:4566' # Edge port: every emulated AWS service speaks here.
    environment:
      - SERVICES=s3,sqs
      - DEBUG=${LOCALSTACK_DEBUG:-0}
      - PERSISTENCE=1
      - DEFAULT_REGION=${AWS_REGION:-us-east-1}
      # - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN} # required if you upgrade the image tag above
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  localstack-data:
